<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Paxta Harvest Simulator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #e76f51;
      --bg-top: #ff7e5f;
      --bg-mid: #feb47b;
      --ground-top: #5c3a21;
      --ground-bot: #2a1608;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0; padding: 0;
    }
    body {
      background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 55%, var(--ground-top) 55%, var(--ground-bot) 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Atmospheric Sun */
    .sun {
      position: absolute;
      top: 15%; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 120px;
      background: radial-gradient(circle, #fffdf2 0%, #ffdf85 40%, rgba(255,223,133,0) 80%);
      border-radius: 50%;
      box-shadow: 0 0 60px 20px rgba(255, 200, 100, 0.4);
      z-index: 0;
    }

    /* Glassmorphism UI */
    .header {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }
    .hud-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 20px;
      border-radius: 16px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      flex: 1;
      margin: 0 5px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .hud-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
    .hud-value { font-size: 24px; font-weight: 800; margin-top: 4px; }
    
    /* Progress Bar */
    .progress-bg {
      width: 100%; height: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px; margin-top: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: #4caf50;
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* Game Stage */
    .stage {
      position: relative;
      width: 100%; height: 60%;
      display: flex; justify-content: center; z-index: 5;
    }

    /* Improved Character Silhouette */
    .character {
      width: 180px; height: 280px;
      position: absolute;
      bottom: 20px; left: 10%;
      transform-origin: bottom center;
      transition: transform 0.15s ease-out;
      filter: drop-shadow(0 15px 10px rgba(0,0,0,0.5));
    }
    
    /* Plant & Bolls */
    .cotton-plant {
      position: absolute;
      bottom: 10px; right: 5%;
      width: 180px; height: 250px;
    }
    .stem {
      position: absolute; bottom: 0; left: 80px;
      width: 6px; height: 200px;
      background: #3e2723;
      border-radius: 4px;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.5);
    }
    .branch {
      position: absolute;
      background: #3e2723;
      height: 4px; border-radius: 2px;
    }
    .boll-wrapper {
      position: absolute;
      width: 60px; height: 60px;
      margin-left: -30px; margin-top: -30px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
    }
    .boll-wrapper:active { transform: scale(0.85); }
    
    /* Realistic Cotton SVG */
    .cotton-svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }

    /* Floating Text Animation */
    .floater {
      position: absolute;
      color: #fff;
      font-weight: 800; font-size: 24px;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
      animation: floatUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      pointer-events: none; z-index: 20;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
    }

    /* Action Button */
    .footer {
      width: 100%; padding: 0 20px 30px 20px; z-index: 10;
    }
    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, #2a9d8f 0%, #21867a 100%);
      color: white; border: none;
      padding: 18px; border-radius: 20px;
      font-size: 18px; font-weight: 800;
      box-shadow: 0 8px 20px rgba(42, 157, 143, 0.4);
      transition: all 0.2s;
    }
    .btn-action:disabled {
      background: rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.5);
      box-shadow: none; border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-action:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 4px 10px rgba(42,157,143,0.4); }
  </style>
</head>
<body>

  <div class="sun"></div>

  <div class="header">
    <div class="hud-card">
      <div class="hud-title">Etak (Apron)</div>
      <div class="hud-value"><span id="apron">0.00</span> <span style="font-size:14px">kg</span></div>
      <div class="progress-bg"><div class="progress-fill" id="apronProgress"></div></div>
    </div>
    <div class="hud-card">
      <div class="hud-title">Total Picked</div>
      <div class="hud-value"><span id="total">0.00</span> <span style="font-size:14px">kg</span></div>
    </div>
  </div>

  <div class="stage">
    <!-- Improved Human Silhouette (Sunset Lighting) -->
    <svg class="character" id="worker" viewBox="0 0 200 300">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1a1a24"/>
          <stop offset="100%" stop-color="#3a2a32"/>
        </linearGradient>
        <linearGradient id="apronGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f8edeb"/>
          <stop offset="100%" stop-color="#d3cdc9"/>
        </linearGradient>
      </defs>
      <!-- Back Arm -->
      <path d="M110,120 Q140,160 160,140" stroke="#2c2025" stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- Body & Dress -->
      <path d="M70,100 Q60,180 50,280 L150,280 Q130,180 130,100 Z" fill="url(#bodyGrad)"/>
      <!-- Apron (Etak) -->
      <path d="M55,140 Q100,240 145,140 Q100,160 55,140 Z" fill="url(#apronGrad)"/>
      <!-- Head & Scarf -->
      <circle cx="100" cy="50" r="25" fill="#2c2025"/>
      <path d="M75,50 Q100,0 125,50 Q135,90 100,90 Q65,90 75,50 Z" fill="#4a2a32"/>
      <!-- Reaching Arm -->
      <path id="frontArm" d="M100,110 Q140,120 180,100" stroke="#3a2a32" stroke-width="20" stroke-linecap="round" fill="none"/>
    </svg>

    <!-- Detailed Cotton Plant -->
    <div class="cotton-plant">
      <div class="stem"></div>
      <div class="branch" style="bottom: 40px; left: 20px; width: 60px; transform: rotate(-30deg);"></div>
      <div class="branch" style="bottom: 90px; left: 80px; width: 70px; transform: rotate(25deg);"></div>
      <div class="branch" style="bottom: 140px; left: 40px; width: 50px; transform: rotate(-15deg);"></div>

      <!-- Interactive Cotton Bolls -->
      <div class="boll-wrapper" style="bottom: 50px; left: 10px;" onclick="pickCotton(event, this)">
        <svg class="cotton-svg" viewBox="0 0 100 100">
          <path d="M50,40 L30,20 L40,50 L20,60 L45,65 L50,90 L60,65 L85,60 L65,50 L75,20 Z" fill="#6d4c41"/>
          <circle cx="40" cy="45" r="18" fill="#fff"/>
          <circle cx="65" cy="50" r="16" fill="#f5f5f5"/>
          <circle cx="50" cy="65" r="18" fill="#fff"/>
          <circle cx="50" cy="40" r="15" fill="#f0f0f0"/>
        </svg>
      </div>

      <div class="boll-wrapper" style="bottom: 110px; left: 140px;" onclick="pickCotton(event, this)">
        <svg class="cotton-svg" viewBox="0 0 100 100">
          <path d="M50,40 L30,20 L40,50 L20,60 L45,65 L50,90 L60,65 L85,60 L65,50 L75,20 Z" fill="#6d4c41"/>
          <circle cx="40" cy="45" r="18" fill="#fff"/>
          <circle cx="65" cy="50" r="16" fill="#f5f5f5"/>
          <circle cx="50" cy="65" r="18" fill="#fff"/>
        </svg>
      </div>

      <div class="boll-wrapper" style="bottom: 160px; left: 20px;" onclick="pickCotton(event, this)">
        <svg class="cotton-svg" viewBox="0 0 100 100">
          <path d="M50,40 L30,20 L40,50 L20,60 L45,65 L50,90 L60,65 L85,60 L65,50 L75,20 Z" fill="#6d4c41"/>
          <circle cx="40" cy="45" r="18" fill="#fff"/>
          <circle cx="65" cy="50" r="16" fill="#f5f5f5"/>
          <circle cx="50" cy="65" r="18" fill="#fff"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-action" id="emptyBtn" onclick="emptyApron()" disabled>
      Empty Apron to Trailer
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    let apronWeight = 0.0;
    let totalWeight = 0.0;
    const maxCapacity = 5.0;

    function pickCotton(event, bollElement) {
      if (apronWeight >= maxCapacity) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        document.getElementById('apronProgress').style.background = '#e63946';
        setTimeout(() => document.getElementById('apronProgress').style.background = '#e9c46a', 300);
        return;
      }

      // Add realism: Randomize weight picked (30g to 80g per boll)
      const weight = (Math.floor(Math.random() * 6) + 3) / 100; 

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      // Animate Character Reaching
      const worker = document.getElementById('worker');
      worker.style.transform = "rotate(5deg) translateX(15px)";
      setTimeout(() => worker.style.transform = "none", 150);

      // Update Weights
      apronWeight = Math.min(maxCapacity, apronWeight + weight);
      document.getElementById('apron').innerText = apronWeight.toFixed(2);
      
      // Update Progress Bar
      const fillPercentage = (apronWeight / maxCapacity) * 100;
      const progressFill = document.getElementById('apronProgress');
      progressFill.style.width = fillPercentage + '%';
      
      // Change color based on fullness
      if(fillPercentage > 90) progressFill.style.background = '#e63946'; // Red when full
      else if(fillPercentage > 50) progressFill.style.background = '#e9c46a'; // Yellow
      else progressFill.style.background = '#4caf50'; // Green

      document.getElementById('emptyBtn').disabled = apronWeight === 0;

      // Visual text
      showFloater(event.clientX, event.clientY, `+${(weight * 1000).toFixed(0)}g`);

      // Pluck animation (hide cotton, leave empty brown husk)
      const cottonFluffs = bollElement.querySelectorAll('circle');
      cottonFluffs.forEach(c => c.style.opacity = '0');
      bollElement.style.pointerEvents = 'none';

      // Realism: Regrow cotton after a random time (3 to 6 seconds)
      const regrowTime = Math.random() * 3000 + 3000;
      setTimeout(() => {
        cottonFluffs.forEach(c => {
          c.style.transition = "opacity 1s";
          c.style.opacity = '1';
        });
        bollElement.style.pointerEvents = 'auto';
      }, regrowTime);
    }

    function emptyApron() {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      
      totalWeight += apronWeight;
      apronWeight = 0.0;
      
      document.getElementById('apron').innerText = "0.00";
      document.getElementById('total').innerText = totalWeight.toFixed(2);
      
      const progressFill = document.getElementById('apronProgress');
      progressFill.style.width = '0%';
      progressFill.style.background = '#4caf50';
      
      document.getElementById('emptyBtn').disabled = true;
    }

    function showFloater(x, y, text) {
      const el = document.createElement('div');
      el.className = 'floater';
      el.innerText = text;
      el.style.left = `${x - 20}px`;
      el.style.top = `${y - 30}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }
  </script>
</body>
</html>
